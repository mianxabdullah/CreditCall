<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underwrite — Talk to an Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ede1; --paper-raised: #faf6ec; --ink: #1e2a3a; --ink-soft: #5b6472;
    --brass: #a9812e; --brass-soft: #cdb37a; --approve: #2e6e49; --reject: #9b3b30; --rule: #d8cfba;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 20px 40px;
    background:
      radial-gradient(circle at 20% 15%, rgba(169,129,46,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(30,42,58,0.04), transparent 45%),
      var(--paper);
    font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh;
  }
  .dossier { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 88px); }

  .letterhead {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 6px; flex-shrink: 0;
  }
  .letterhead h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; }
  .letterhead .mark { font-style: italic; color: var(--brass); }
  .letterhead a {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--ink-soft);
    text-decoration: none; border-bottom: 1px solid var(--rule);
  }
  .letterhead a:hover { color: var(--brass); border-color: var(--brass); }

  .subline {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--brass); margin: 10px 0 20px; flex-shrink: 0;
  }

  .chat-card {
    background: var(--paper-raised); border: 1px solid var(--rule);
    box-shadow: 0 1px 0 var(--brass-soft), 0 18px 40px -24px rgba(30,42,58,0.35);
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }

  .messages {
    flex: 1; overflow-y: auto; padding: 22px 22px 10px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .msg { max-width: 82%; font-size: 0.88rem; line-height: 1.5; }
  .msg.bot {
    align-self: flex-start; background: #fff; border: 1px solid var(--rule);
    padding: 10px 14px; border-radius: 2px 10px 10px 10px;
  }
  .msg.user {
    align-self: flex-end; background: var(--ink); color: var(--paper-raised);
    padding: 10px 14px; border-radius: 10px 2px 10px 10px;
  }
  .msg.typing { align-self: flex-start; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; }

  .verdict-card {
    align-self: stretch; background: #fff; border: 1px solid var(--rule);
    padding: 16px 18px; margin-top: 4px;
  }
  .verdict-card .stamp-line {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.2rem; margin-bottom: 6px;
  }
  .verdict-card.approved .stamp-line { color: var(--approve); }
  .verdict-card.rejected .stamp-line { color: var(--reject); }
  .verdict-card .meta {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--ink-soft);
    display: flex; justify-content: space-between; margin-top: 4px;
  }
  .verdict-card a {
    display: inline-block; margin-top: 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--brass); text-decoration: none; border-bottom: 1px solid var(--brass);
  }

  .input-row {
    display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--rule); flex-shrink: 0;
  }
  .input-row input {
    flex: 1; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 0.88rem;
    border: 1px solid var(--rule); border-radius: 2px; background: #fff;
  }
  .input-row input:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(169,129,46,0.15); }
  .input-row button {
    padding: 0 20px; background: var(--ink); color: var(--paper-raised); border: none;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.06em; cursor: pointer; border-radius: 2px;
  }
  .input-row button:hover { background: #2c3d54; }
  .input-row button:disabled { opacity: 0.5; cursor: wait; }

  .error-note {
    margin: 0 22px 14px; padding: 10px 12px; background: #fbeeea; border-left: 3px solid var(--reject);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--reject); display: none;
  }
  .error-note.show { display: block; }
</style>
</head>
<body>
<div class="dossier">

  <div class="letterhead">
    <h1>Under<span class="mark">write</span></h1>
    <a href="/static/index.html">Use the form instead &rarr;</a>
  </div>
  <div class="subline">Credit Assessment Desk — Speak With an Assistant</div>

  <div class="chat-card">
    <div class="messages" id="messages"></div>
    <div class="error-note" id="errorNote"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Tell me about your loan needs…" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const API_KEY = "helloabd"; // demo only — see README note on client-side keys

  // A fresh session id per browser tab session, so the backend can track
  // this conversation's collected fields separately from anyone else's.
  let sessionId = sessionStorage.getItem('underwrite_chat_session');
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem('underwrite_chat_session', sessionId);
  }

  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const errorNote = document.getElementById('errorNote');

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typingIndicator';
    div.textContent = 'Assistant is typing…';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function addVerdict(data) {
    const approved = data.loan_status === 'Approved';
    const div = document.createElement('div');
    div.className = `verdict-card ${approved ? 'approved' : 'rejected'}`;
    div.innerHTML = `
      <div class="stamp-line">${approved ? 'Approved' : 'Declined'}</div>
      <div class="meta">
        <span>Confidence: ${(data.approval_probability * 100).toFixed(1)}%</span>
        <span>Case #${data.applicant_id}</span>
      </div>
      <a href="/static/index.html">File another application &rarr;</a>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    errorNote.className = 'error-note';
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        errorNote.textContent = data.detail || 'Something went wrong.';
        errorNote.classList.add('show');
        return;
      }

      if (data.type === 'prediction') {
        addVerdict(data);
      } else {
        addMessage(data.text, 'bot');
      }
    } catch (err) {
      removeTyping();
      errorNote.textContent = 'Network error — ' + err.message;
      errorNote.classList.add('show');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  // Opening message from the assistant, purely cosmetic — doesn't hit the API.
  addMessage("Hi! I can help you check your loan approval odds. Tell me a bit about yourself — for example, your income, marital status, and what you're looking to borrow.", 'bot');
  input.focus();
</script>
</body>
</html>
